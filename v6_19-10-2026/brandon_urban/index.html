<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tienda de Ropa</title>
    <!-- Fuentes de Google (Bebas Neue y DM Sans) para el título y los textos del login. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Bootstrap (diseño), Bootstrap Icons (íconos) y general.css (estilos propios del proyecto). -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="general.css">
</head>
<body class="login-pagina">
    <!-- Corte diagonal: banda roja detrás y panel negro con el carrusel del local -->
    <div class="login-corte-rojo"></div>
    <div class="login-corte-negro">
        <!-- Fotos del local: guárdalas en la carpeta img/ como local1.jpg, local2.jpg, local3.jpg y local4.jpg -->
        <div id="carruselLocal" class="carousel slide carousel-fade login-carrusel" data-bs-ride="carousel" data-bs-interval="3500" data-bs-pause="false">
            <!-- Rayitas indicadoras del carrusel (una por cada foto). -->
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#carruselLocal" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Imagen 1"></button>
                <button type="button" data-bs-target="#carruselLocal" data-bs-slide-to="1" aria-label="Imagen 2"></button>
                <button type="button" data-bs-target="#carruselLocal" data-bs-slide-to="2" aria-label="Imagen 3"></button>
                <button type="button" data-bs-target="#carruselLocal" data-bs-slide-to="3" aria-label="Imagen 4"></button>
            </div>
            <!-- Las 4 fotos del carrusel; si una imagen no existe se oculta y queda el fondo oscuro. -->
            <div class="carousel-inner">
            <div class="carousel-item active">
                <img class="slide-foto" src="img/local1.jpg" alt="Local de ropa BRANDON URBAN: Camisetas" onerror="this.style.display='none';">
            </div>
            <div class="carousel-item">
                <img class="slide-foto" src="img/local2.jpg" alt="Local de ropa BRANDON URBAN: Pantalones" onerror="this.style.display='none';">
            </div>
            <div class="carousel-item">
                <img class="slide-foto" src="img/local3.jpg" alt="Local de ropa BRANDON URBAN: Gorras" onerror="this.style.display='none';">
            </div>
            <div class="carousel-item">
                <img class="slide-foto" src="img/local4.jpg" alt="Local de ropa BRANDON URBAN: Zapatos" onerror="this.style.display='none';">
            </div>
            </div>
        </div>
    </div>

    <!-- Marca: logo y nombre encima del carrusel -->
    <section class="login-marca">
        <div class="login-logo">
            <img src="img/logo.png" alt="Logo BRANDON URBAN" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <span class="logo-letra">B</span>
        </div>
        <h1 class="login-nombre">BRANDON URBAN</h1>
    </section>

    <!-- Formulario -->
    <section class="login-panel">
        <div class="login-tarjeta">
            <h2 class="login-titulo">Ingresar al sistema</h2>
            <p class="login-ayuda">Elige tu rol e inicia sesión</p>

            <!-- Formulario de login: envía el rol, el usuario y la contraseña a usuario.php para validarlos. -->
            <form action="usuario.php" method="POST">
                <div class="mb-3">
                    <div class="form-label">Tipo de acceso</div>
                    <!-- Elección de rol con dos botones tipo radio (Administrador o Empleado). -->
                    <div class="rol-grupo">
                        <label class="rol-opcion">
                            <input type="radio" name="tipo_acceso" value="Administrador" required>
                            <span class="rol-caja"><i class="bi bi-shield-check"></i>Administrador</span>
                        </label>
                        <label class="rol-opcion">
                            <input type="radio" name="tipo_acceso" value="Empleado" required>
                            <span class="rol-caja"><i class="bi bi-bag"></i>Empleado</span>
                        </label>
                    </div>
                </div>

                <div class="mb-3">
                    <!-- Campo de usuario. -->
                    <label class="form-label" for="username">Usuario</label>
                    <div class="campo-icono">
                        <i class="bi bi-person"></i>
                        <input type="text" id="username" name="username" class="form-control" autocomplete="username" required>
                    </div>
                </div>

                <div class="mb-3">
                    <!-- Campo de contraseña, con un botón de ojo para mostrarla u ocultarla. -->
                    <label class="form-label" for="password">Contraseña</label>
                    <div class="campo-icono">
                        <i class="bi bi-lock"></i>
                        <input type="password" id="password" name="password" class="form-control con-boton" autocomplete="current-password" required>
                        <button type="button" id="ver-clave" class="ver-clave" aria-label="Mostrar contraseña"><i class="bi bi-eye"></i></button>
                    </div>
                </div>

                <!-- Botón que envía el formulario. -->
                <button type="submit" class="btn btn-danger w-100 login-boton"><i class="bi bi-box-arrow-in-right me-1"></i>Ingresar</button>
            </form>
        </div>
    </section>

    <!-- JavaScript de Bootstrap (necesario para que funcione el carrusel). -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Mostrar / ocultar la contraseña
        document.getElementById("ver-clave").addEventListener("click", function () {
            var campo = document.getElementById("password");
            // Si el campo está oculto lo muestra como texto (y cambia el ícono y la etiqueta); si ya está visible, lo vuelve a ocultar.
            var oculta = campo.type === "password";
            campo.type = oculta ? "text" : "password";
            this.querySelector("i").className = oculta ? "bi bi-eye-slash" : "bi bi-eye";
            this.setAttribute("aria-label", oculta ? "Ocultar contraseña" : "Mostrar contraseña");
        });
    </script>
</body>
</html>
