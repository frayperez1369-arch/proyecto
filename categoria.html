<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Categoría</title>
    <link rel="stylesheet" href="stylemenu.css">
</head>

<body>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

<style>

/* GENERAL */
body{
    margin:0;
    overflow-x:hidden;
    font-family:Arial, Helvetica, sans-serif;
    background:#f5f5f5;
}

/* SIDEBAR */
.sidebar{
    width:250px;
    height:100vh;
    background:#111827;
    position:fixed;
    left:0;
    top:0;
    padding-top:20px;
}

/* TITULO */
.sidebar h2{
    color:white;
    text-align:center;
    margin-bottom:20px;
    font-weight:bold;
}

/* PANEL USUARIO */
.user-panel{
    text-align:center;
    padding-bottom:20px;
    border-bottom:1px solid #374151;
    margin-bottom:20px;
}

/* ICONO USUARIO */
.user-icon{
    font-size:70px;
    color:white;
}

/* LINKS */
.sidebar a{
    display:block;
    color:#d1d5db;
    text-decoration:none;
    padding:15px 25px;
    transition:0.3s;
    font-size:16px;
}

/* EFECTO HOVER */
.sidebar a:hover{
    background:#1f2937;
    color:white;
    padding-left:35px;
}

/* ICONOS MENU */
.sidebar i{
    margin-right:10px;
}

/* CONTENIDO */
.content{
    margin-left:250px;
    padding:20px;
}

/* CARRUSEL */
.carousel-item img{
    height:90vh;
    object-fit:cover;
    border-radius:20px;
}

/* TEXTO SOBRE IMAGEN */
.carousel-caption{
    background:rgba(0,0,0,0.5);
    border-radius:15px;
    padding:20px;
}

</style>

</head>

<!-- MENU LATERAL -->
<div class="sidebar">

    <h2>Brandon Urban</h2>

    <!-- PANEL USUARIO -->
    <div class="user-panel">

        <i class="bi bi-person-circle user-icon"></i>

        <h5 class="text-white mt-2 mb-0">
            Administrador
        </h5>

        <small class="text-secondary">
            Sistema activo
        </small>

    </div>

    <a href="indexmenu.html">
        <i class="bi bi-house-door-fill"></i>
        Inicio
    </a>

    <a href="producto.html">
        <i class="bi bi-box-seam"></i>
        Productos
    </a>

    <a href="entrada_inventario.html">
        <i class="bi bi-arrow-down-square"></i>
        Entrada Inventario
    </a>

    <a href="salida_inventario.html">
        <i class="bi bi-arrow-up-square"></i>
        Salida Inventario
    </a>

    <a href="categoria.html">
        <i class="bi bi-tags-fill"></i>
        Categorías
    </a>

    <a href="proveedor.html">
        <i class="bi bi-truck"></i>
        Proveedores
    </a>

    <a href="index.html">
        <i class="bi bi-box-arrow-left"></i>
        Cerrar Sesión
    </a>

</div>

<div class="page">

    <div class="card">

        <h1>Categoría</h1>

        <form class="search-wrap">
            <input type="text" placeholder="Buscar...">
        </form>

        <form>

            <div class="form-group">
                <label>Código:</label>
                <input type="text">
            </div>

            <div class="form-group">
                <label>Nombre:</label>
                <input type="text">
            </div>

            <div class="form-group">
                <label>Descripción:</label>
                <input type="text">
            </div>

            <div class="btn-row">
                <button class="editar">Editar</button>
                <button class="agregar">Agregar</button>
                <button class="eliminar">Eliminar</button>
            </div>

        </form>

    </div>

</div>

</body>
</html>
