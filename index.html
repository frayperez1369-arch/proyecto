<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tienda de Ropa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="general.css">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh;">
    <div class="card shadow-sm" style="width:100%;max-width:400px;">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <div class="rounded-circle bg-white border mx-auto d-flex align-items-center justify-content-center overflow-hidden" style="width:72px;height:72px;">
                    <img src="logo.png" alt="JFYJ" class="w-100 h-100 object-fit-cover" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <span class="fw-bold fs-3" style="display:none;">J</span>
                </div>
                <h4 class="brand-jfyj fw-bold mt-2 mb-0">JFYJ</h4>
                <small class="text-muted">Ingresar al sistema - Tienda de Ropa</small>
            </div>

            <form action="usuario.php" method="POST">
                <div class="mb-3">
                    <label class="form-label">Tipo de acceso</label>
                    <select name="tipo_acceso" class="form-select" required>
                        <option value="select">Seleccionar Rol</option>
                        <option value="Administrador">Administrador</option>
                        <option value="Empleado">Empleado</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-danger w-100"><i class="bi bi-box-arrow-in-right me-1"></i>Ingresar</button>
            </form>
        </div>
    </div>
</body>
</html>
