<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Brandon Urban – Sistema de Gestión de Inventario</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Bootstrap Icons -->
  <o href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet"/>
  <!-- Estilos propios -->
  <link href="style_intro.css" rel="stylesheet"/>
  <link href="styles.css" rel="stylesheet"/>
</head>
<body>

  <!-- CARRUSEL DE FONDO -->
  <div id="bgCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="4000">
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#bgCarousel" data-bs-slide-to="0" class="active"></button>
      <button type="button" data-bs-target="#bgCarousel" data-bs-slide-to="1"></button>
      <button type="button" data-bs-target="#bgCarousel" data-bs-slide-to="2"></button>
      <button type="button" data-bs-target="#bgCarousel" data-bs-slide-to="3"></button>
    </div>
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="https://images.unsplash.com/photo-1558769132-cb1aea458c5e?w=1920&q=100" alt="Ropa 1"/>
      </div>
      <div class="carousel-item">
        <img src="https://images.unsplash.com/photo-1567401893414-76b7b1e5a7a5?w=1920&q=100" alt="Ropa 2"/>
      </div>
      <div class="carousel-item">
        <img src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=1920&q=100" alt="Ropa 3"/>
      </div>
      <div class="carousel-item">
        <img src="https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?w=1920&q=100" alt="Ropa 4"/>
      </div>
    </div>
  </div>

  <!-- FORMULARIO DE LOGIN -->
  <div class="login-wrapper">
    <div class="card-login">

      <!-- Encabezado -->
      <div class="text-center">
        <div class="brand-title">Brandon Urban</div>
        <div class="brand-subtitle">Sistema de Gestión de Inventario</div>
        <div class="divider-accent"></div>
      </div>

      <!-- Tipo de usuario -->
      <div class="section-label">Tipo de usuario</div>
      <div class="btn-group w-100 mb-3" role="group">
        <button type="button" id="btnEmpleado" class="btn btn-outline-secondary" onclick="setTipo('empleado')">
          <i class="bi bi-person-badge me-1"></i> Empleado
        </button>
        <button type="button" id="btnAdmin" class="btn btn-dark" onclick="setTipo('admin')">
          <i class="bi bi-shield-lock-fill text-warning me-1"></i> Administrador
        </button>
      </div>

      <!-- Usuario -->
      <div class="input-group mb-3">
        <span class="input-group-text bg-light border-end-0">
          <i class="bi bi-person-fill text-secondary"></i>
        </span>
        <input type="text" class="form-control bg-light border-start-0" placeholder="Usuario" id="inputUsuario"/>
      </div>

      <!-- Contraseña -->
      <div class="input-group mb-4">
        <span class="input-group-text bg-light border-end-0">
          <i class="bi bi-lock-fill text-secondary"></i>
        </span>
        <input type="password" class="form-control bg-light border-start-0" placeholder="Contraseña" id="inputPass"/>
      </div>

      <!-- Botón ingresar -->
      <button class="btn btn-ingresar w-100 text-white text-uppercase fw-bold" onclick="ingresar()">
        <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar al Sistema
      </button>

      <!-- Footer -->
      <div class="card-footer-text">
        <a href="#">Contactar con administrador</a>
      </div>

    </div>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function setTipo(tipo) {
      const btnE = document.getElementById('btnEmpleado');
      const btnA = document.getElementById('btnAdmin');
      if (tipo === 'empleado') {
        btnE.classList.replace('btn-outline-secondary', 'btn-dark');
        btnA.classList.replace('btn-dark', 'btn-outline-secondary');
      } else {
        btnA.classList.replace('btn-outline-secondary', 'btn-dark');
        btnE.classList.replace('btn-dark', 'btn-outline-secondary');
      }
    }

    function ingresar() {
  const u = document.getElementById('inputUsuario').value.trim();
  const p = document.getElementById('inputPass').value.trim();

  if (!u || !p) { alert('Por favor completa usuario y contraseña.'); return; }

  const esAdmin = document.getElementById('btnAdmin').classList.contains('btn-dark');

  if (esAdmin) {
    window.location.href = 'indexmenu.html';
  } else {
    window.location.href = 'indexmenu.html';
  }
}
  </script>
</body>
</html>
